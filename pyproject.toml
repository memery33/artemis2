[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis2"
version = "0.1.0"
description = "Toolkit for NASA's Artemis II PDS lunar-science release, plus an Orion-window flyby replay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Emery" }]
keywords = ["artemis", "pds", "moon", "nasa"]
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "pandas>=2.0",
    "pillow>=10",
    "pyarrow>=14",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
artemis2 = "artemis2.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artemis2 = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
